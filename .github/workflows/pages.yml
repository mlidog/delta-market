name: 更新数据并部署看板

# GitHub 的 cron 用 UTC。北京时间 16:00 / 22:00 / 次日 00:00 对应 08:00 / 14:00 / 16:00 UTC
on:
  schedule:
    - cron: "0 8,14,16 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write # 需要把导出的 JSON 快照提交回仓库
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装后端依赖
        run: pip install -e .

      # 只有定时任务与手动触发才去调数据帝接口；普通 push 不采集，避免白花资源
      - name: 采集并导出静态数据
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          DELTA_API_TOKEN: ${{ secrets.DELTA_API_TOKEN }}
          DATA_SOURCE: delta
          SCHEDULER_ENABLED: "false"
        run: python -m scripts.export_static

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 构建静态前端
        working-directory: frontend
        env:
          VITE_STATIC: "true"
        run: |
          npm ci
          npm run build

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: 部署到 GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: 把数据快照提交回仓库
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data
          git diff --quiet --cached || git commit -m "chore: 更新数据快照 [skip ci]"
          git push
